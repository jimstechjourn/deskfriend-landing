<!doctype html>
<!-- Source for og-image.png (1200x630 social link preview). Re-render with scripts/render-og.sh. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#F7F1E4;color:#3C2B12;font-family:Nunito,sans-serif;
       display:flex;align-items:center;gap:56px;padding:0 88px;box-sizing:border-box;position:relative}
  .copy{flex:1}
  .brand{font-family:Fredoka,sans-serif;font-weight:600;font-size:34px;color:#C9832A;margin:0 0 18px}
  h1{font-family:Fredoka,sans-serif;font-weight:700;font-size:74px;line-height:1.02;margin:0 0 26px;letter-spacing:-.01em}
  h1 .accent{color:#3E9E63}
  p{font-size:28px;font-weight:600;color:#7A6748;margin:0}
  .pip{width:360px;height:360px;flex:none;background:#F1E3C6;border-radius:50%;display:grid;place-items:center}
  .pip svg{width:260px;height:260px}
  .bar{position:absolute;left:0;right:0;bottom:0;height:14px;background:#E7A23C}
</style></head>
<body>
  <div class="copy">
    <div class="brand">DeskFriend</div>
    <h1>A good friend won&rsquo;t let you <span class="accent">sit all day</span>.</h1>
    <p>Free stretch &amp; breathing reminders for Chrome.<br>No account. Zero tracking.</p>
  </div>
  <div class="pip">
    <svg viewBox="0 0 128 128" aria-hidden="true">
      <path d="M64 30 Q62 19 67 11" stroke="#3E9E63" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M62 20 Q50 15 49 23 Q59 26 62 20 Z" fill="#3E9E63"/>
      <circle cx="68" cy="10" r="6" fill="#57B87D"/>
      <path d="M64 122 C28 122 16 96 19 66 C22 40 40 24 64 24 C88 24 106 40 109 66 C112 96 100 122 64 122 Z" fill="#E7A23C"/>
      <ellipse cx="64" cy="92" rx="24" ry="18" fill="#F3C67E" opacity="0.7"/>
      <circle cx="50" cy="66" r="10" fill="#3C2B12"/>
      <circle cx="78" cy="66" r="10" fill="#3C2B12"/>
      <circle cx="46.5" cy="62" r="3.2" fill="#FFFFFF"/>
      <circle cx="74.5" cy="62" r="3.2" fill="#FFFFFF"/>
      <path d="M55 84 Q64 92 73 84" stroke="#3C2B12" stroke-width="4.4" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="bar"></div>
</body></html>
